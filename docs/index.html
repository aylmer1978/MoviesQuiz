<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0b14">
  <title>The Letterboxd Quiz</title>
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <header class="topbar">
    <h1 id="appTitle"><img src="img/logo.webp" alt="The Letterboxd Quiz" class="logo"></h1>
  </header>

  <main id="app">
    <!-- Pantalla: selección de lista -->
    <section id="screen-select" class="screen active">
      <div class="global-ranking">
        <h3 class="list-subtitle">🏆 Top 5 global</h3>
        <div id="globalRanking">⏳ Cargando…</div>
      </div>
      <p class="subtitle">Elige una lista para jugar</p>
      <ul id="quizList" class="quiz-list"></ul>
    </section>

    <!-- Pantalla: detalle de una lista -->
    <section id="screen-list" class="screen">
      <div id="listImage" class="list-image"></div>
      <h2 id="listName" class="list-name"></h2>
      <p id="listMeta" class="list-meta"></p>
      <p id="listDesc" class="list-desc"></p>

      <h3 class="list-subtitle">🏆 Ranking</h3>
      <div id="listRanking" class="list-ranking"></div>

      <div class="list-actions">
        <button id="btnPlay" class="btn-primary">▶ Jugar</button>
        <button id="btnListBack" class="btn-ghost">← Volver al listado</button>
      </div>
    </section>

    <!-- Pantalla: juego -->
    <section id="screen-game" class="screen">
      <div class="game-header">
        <button id="btnBack" class="btn-ghost">← Salir</button>
        <span id="scoreLabel" class="score">Aciertos: 0 · Errores: 0/3</span>
      </div>
      <div id="datasetName" class="dataset-name"></div>
      <div class="timer">
        <div class="timer-track"><div id="timerBar" class="timer-bar"></div></div>
        <span id="timerText" class="timer-text">15</span>
      </div>

      <div id="questionBox" class="question-box"></div>
      <div id="options" class="options"></div>

      <div class="game-footer">
        <span id="feedback" class="feedback"></span>
        <button id="btnNext" class="btn-primary" hidden>Siguiente →</button>
      </div>
    </section>

    <!-- Pantalla: fin de partida -->
    <section id="screen-end" class="screen">
      <h2 id="endTitle"></h2>
      <p id="endScore" class="end-score"></p>
      <div id="endRecord" class="end-record"></div>
      <div id="nameEntry" class="name-entry" hidden>
        <input id="nameInput" type="text" maxlength="40" placeholder="Tu nombre" autocomplete="off">
        <button id="btnSaveRecord" class="btn-primary">Guardar récord</button>
      </div>
      <button id="btnPlayAgain" class="btn-primary">← Volver a la lista</button>
    </section>
  </main>

  <script src="js/quiz.js?v=1"></script>
  <script src="js/records.js?v=1"></script>
  <script src="js/app.js?v=1"></script>

</body>
</html>
